[project]
name = "voice-infer"
version = "0.1.0"
description = "分布式语音推理服务平台"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=12",
    "numpy>=2.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "soundfile>=0.12",
    "funasr>=1.4",
    "voxcpm>=2.0.3",
    "torch>=2.8",
    "torchaudio>=2.8",
    "httpx>=0.27",
    "aiofiles>=24",
]

[project.optional-dependencies]
memory = ["mem0ai", "sentence-transformers", "qdrant-client"]
dev = ["pytest", "pytest-asyncio"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
