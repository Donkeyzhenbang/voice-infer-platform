<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Voice Infer Platform</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;background:#f5f5f7;color:#1d1d1f;height:100vh;display:flex;flex-direction:column}
.header{background:#fff;padding:12px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #e5e5e5;flex-shrink:0;flex-wrap:wrap;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.header h1{font-size:17px;font-weight:600;color:#1d1d1f}
.header .badge{font-size:11px;padding:2px 8px;border-radius:10px;background:#e8f5e9;color:#2e7d32}
.header .badge.off{background:#fce4ec;color:#c62828}
.header .badge.thinking{background:#fff3e0;color:#e65100}
.header .badge.speaking{background:#e3f2fd;color:#1565c0}
.header .badge.listening{background:#e8f5e9;color:#2e7d32;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}

.conversation{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px;background:#fafafa}
.msg{max-width:75%;padding:12px 16px;border-radius:16px;font-size:15px;line-height:1.5;word-break:break-word;animation:fadeIn .2s}
.msg.user{align-self:flex-end;background:#007aff;color:#fff;border-bottom-right-radius:4px}
.msg.assistant{align-self:flex-start;background:#fff;color:#1d1d1f;border:1px solid #e5e5e5;border-bottom-left-radius:4px}
.msg .label{font-size:11px;opacity:.7;margin-bottom:4px;font-weight:500}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.controls{background:#fff;padding:16px 20px;display:flex;align-items:center;justify-content:center;gap:14px;border-top:1px solid #e5e5e5;flex-shrink:0;flex-wrap:wrap}
.btn{width:56px;height:56px;border-radius:50%;border:none;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.btn:hover{transform:scale(1.05);box-shadow:0 4px 16px rgba(0,0,0,.12)}
.btn.primary{background:#007aff;color:#fff}
.btn.primary:hover{background:#0056cc}
.btn.danger{background:#ff3b30;color:#fff}
.btn.danger:hover{background:#cc2f26}
.btn svg{width:24px;height:24px;fill:currentColor}
.hint{font-size:13px;color:#86868b;text-align:center}
.voice-sel{font-size:12px;background:#fff;color:#1d1d1f;border:1px solid #d2d2d7;border-radius:6px;padding:6px 10px;outline:none;cursor:pointer}
.voice-sel:focus{border-color:#007aff;box-shadow:0 0 0 3px rgba(0,122,255,.15)}
.nav{font-size:12px;margin-left:auto}.nav a{color:#007aff;text-decoration:none}.nav a:hover{text-decoration:underline}
.spacer{flex:1}
</style>
</head>
<body>
<div class="header">
  <h1>🎙 Voice Infer</h1>
  <span class="badge" id="status">connecting</span>
  <select class="voice-sel" id="voiceSel"></select>
  <span class="spacer"></span>
  <span class="nav"><a href="/voice">录制的音色</a></span>
</div>
<div class="conversation" id="conversation"></div>
<div class="controls">
  <button class="btn danger" id="stopBtn" style="display:none" title="打断">
    <svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
  </button>
  <button class="btn primary" id="micBtn" title="点击/空格 开始">
    <svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 003-3V5a3 3 0 10-6 0v6a3 3 0 003 3z"/><path d="M17 11a5 5 0 01-10 0H5a7 7 0 006 6.93V21h2v-3.07A7 7 0 0019 11h-2z"/></svg>
  </button>
  <span class="hint" id="hint">点击麦克风开始，直接说话</span>
</div>
<script>
const micBtn=document.getElementById("micBtn"),stopBtn=document.getElementById("stopBtn");
const convEl=document.getElementById("conversation"),statusEl=document.getElementById("status");
const hintEl=document.getElementById("hint"),voiceSel=document.getElementById("voiceSel");
let ws=null,audioCtx=null,stream=null,listening=false;const SR=16000;

function addMsg(role,text){
  const d=document.createElement("div");d.className="msg "+role;
  const l=document.createElement("div");l.className="label";l.textContent=role==="user"?"你":"AI";d.appendChild(l);
  const s=document.createElement("span");s.textContent=text;d.appendChild(s);
  convEl.appendChild(d);convEl.scrollTop=convEl.scrollHeight;return d;
}
let curAsst=null,curSpan=null;

function setStatus(s){statusEl.textContent=s;statusEl.className="badge "+s;}

function loadVoices(){
  const cur=voiceSel.value;
  fetch("/api/voices").then(r=>r.json()).then(d=>{
    voiceSel.innerHTML="";d.voices.forEach(v=>{const o=document.createElement("option");o.value=v.id;o.textContent=v.id+(v.type==="builtin"?" (内置)":" (自定义)");voiceSel.appendChild(o);});
    if(cur)voiceSel.value=cur;  // 保持之前选中的音色不丢失
  });
}
voiceSel.onchange=()=>{if(ws&&ws.readyState===1)ws.send(JSON.stringify({type:"voice_change",voice_id:voiceSel.value}));};

function connect(){
  const p=location.protocol==="https:"?"wss:":"ws:";ws=new WebSocket(p+"//"+location.host+"/ws");ws.binaryType="arraybuffer";
  ws.onopen=()=>{setStatus(listening?"listening":"ready");loadVoices();};
  ws.onmessage=e=>{
    if(typeof e.data==="string"){
      const m=JSON.parse(e.data);
      switch(m.type){
        case"transcription":addMsg("user",m.text);curAsst=null;setStatus("thinking");hintEl.textContent=m.text;break;
        case"llm_token":
          if(!curAsst){curAsst=addMsg("assistant","");curSpan=curAsst.querySelector("span");}
          if(curSpan)curSpan.textContent+=m.text;convEl.scrollTop=convEl.scrollHeight;break;
        case"audio_start":resetAudio();setStatus("speaking");stopBtn.style.display="";break;
        case"audio_end":setStatus(listening?"listening":"ready");stopBtn.style.display="none";break;
        case"persona_changed":case"voice_changed":loadVoices();break;
      }
    }else playChunk(new Uint8Array(e.data));
  };
  ws.onclose=()=>{setStatus("off");setTimeout(connect,2000);};ws.onerror=()=>ws.close();
}

let aq=[],ap=false,_nextT=0;
function resetAudio(){aq=[];ap=false;_nextT=0;}
function playChunk(d){aq.push(d);if(!ap)drain();}
function drain(){
  if(!aq.length){ap=false;return;}
  ap=true;
  if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)({sampleRate:SR});
  // 对齐调度时间：首块立即播，后续块接在上块末尾
  if(_nextT<audioCtx.currentTime) _nextT=audioCtx.currentTime;
  const d=aq.shift();
  const f=new Float32Array(d.length/2),v=new DataView(d.buffer,d.byteOffset,d.byteLength);
  for(let i=0;i<f.length;i++)f[i]=v.getInt16(i*2,!0)/32768;
  const b=audioCtx.createBuffer(1,f.length,SR);b.getChannelData(0).set(f);
  const s=audioCtx.createBufferSource();s.buffer=b;s.connect(audioCtx.destination);
  const t0=_nextT, dur=f.length/SR;
  s.start(t0);_nextT=t0+dur;
  s.onended=()=>{if(aq.length)drain();else{ap=false;_nextT=0;}};
}

micBtn.onclick=()=>listening?stopMic():startMic();
stopBtn.onclick=()=>{if(ws&&ws.readyState===1)ws.send(JSON.stringify({type:"interrupt"}));resetAudio();stopBtn.style.display="none";setStatus(listening?"listening":"ready");};

async function startMic(){
  try{
    stream=await navigator.mediaDevices.getUserMedia({audio:{sampleRate:SR,channelCount:1,echoCancellation:!0,noiseSuppression:!0}});
    audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)({sampleRate:SR});
    const src=audioCtx.createMediaStreamSource(stream),proc=audioCtx.createScriptProcessor(4096,1,1);
    src.connect(proc);proc.connect(audioCtx.destination);
    proc.onaudioprocess=e=>{
      if(!listening||!ws||ws.readyState!==1)return;
      const inp=e.inputBuffer.getChannelData(0),i16=new Int16Array(inp.length);
      for(let i=0;i<inp.length;i++)i16[i]=Math.max(-32768,Math.min(32767,Math.round(inp[i]*32767)));
      ws.send(i16.buffer);
    };
    listening=!0;micBtn.classList.remove("primary");micBtn.classList.add("danger");setStatus("listening");hintEl.textContent="正在收音，直接说话...";
  }catch(e){hintEl.textContent="麦克风权限未授予";}
}
function stopMic(){
  listening=!1;micBtn.classList.remove("danger");micBtn.classList.add("primary");if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}setStatus("ready");hintEl.textContent="点击麦克风开始";
}
document.addEventListener("keydown",e=>{if(e.code==="Space"&&e.target===document.body){e.preventDefault();micBtn.click();}});
connect();
</script>
</body>
</html>
